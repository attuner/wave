<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Pulse Radiations -->
  <g filter="url(#glow)" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" fill="none">
    <!-- Wave 1 -->
    <path d="M 210 200 A 64 64 0 0 1 302 200" opacity="0.95" />
    <!-- Wave 2 -->
    <path d="M 168 160 A 120 120 0 0 1 344 160" opacity="0.8" />
    <!-- Wave 3 -->
    <path d="M 126 120 A 176 176 0 0 1 386 120" opacity="0.6" />
    <!-- Wave 4 -->
    <path d="M 84 80 A 232 232 0 0 1 428 80" opacity="0.35" />
  </g>

  <!-- Transmitter Mast -->
  <g stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 256 220 L 256 250" />
    <path d="M 230 400 L 256 250 L 282 400" fill="none" stroke-width="8" stroke="#38bdf8"/>
    <!-- Cross struts -->
    <path d="M 238 350 L 274 350" stroke="#38bdf8" stroke-width="6"/>
    <path d="M 244 300 L 268 300" stroke="#38bdf8" stroke-width="5"/>
    <path d="M 240 350 L 268 300" stroke="#0284c7" stroke-width="4" opacity="0.8"/>
    <path d="M 272 350 L 244 300" stroke="#0284c7" stroke-width="4" opacity="0.8"/>
    <!-- Base plate -->
    <path d="M 210 400 L 302 400" stroke="#94a3b8" stroke-width="8"/>
  </g>

  <!-- Transmitter Core Beacon -->
  <circle cx="256" cy="220" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="9" fill="#ffffff" />
  
  <!-- "LIVE" Indicator Pill Badge -->
  <rect x="206" y="420" width="100" height="32" rx="16" fill="#ef4444" opacity="0.95" />
  <circle cx="226" cy="436" r="5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="240" y="442" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="2">LIVE</text>
</svg>
